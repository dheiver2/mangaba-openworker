name: Build Windows installers (one-off)

# Disparo manual apenas — não roda em push/PR. Existe só para gerar os
# instaladores .exe/.msi do Windows (PyInstaller não faz cross-compile a
# partir do macOS, então isso precisa de um runner Windows de verdade).
# Depois de rodar, este arquivo e o GitHub Actions do repositório são
# removidos/desabilitados de novo — não é um pipeline de CI permanente.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release onde anexar os instaladores (ex.: v0.1.8)"
        required: true
        default: "v0.1.8"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências Python + PyInstaller
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install --upgrade pip
          .\.venv\Scripts\pip install -e . pyinstaller tzdata typer

      - name: Instalar dependências do frontend
        working-directory: surfaces/gui
        run: npm ci

      - name: Build (PyInstaller + Tauri NSIS/MSI)
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1

      - name: Publicar instaladores na release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleDir = "surfaces\gui\src-tauri\target\release\bundle"
          $files = Get-ChildItem -Path $bundleDir -Recurse -Include *.exe,*.msi
          if ($files.Count -eq 0) { throw "Nenhum instalador gerado em $bundleDir" }
          foreach ($f in $files) {
            Write-Host "Anexando $($f.FullName) à release ${{ github.event.inputs.release_tag }}"
            gh release upload "${{ github.event.inputs.release_tag }}" "$($f.FullName)" --clobber --repo dheiver2/mangaba-openworker
          }
