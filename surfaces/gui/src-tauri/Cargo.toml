[package]
name = "mangaba-desktop"
version = "0.1.0"
description = "Mangaba desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mangaba_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# Abre URLs no navegador do sistema (links "Crie uma chave em…" no cadastro de
# provedor). Sem ele, openExternal caía no window.open, que a WKWebView ignora.
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Lembra tamanho/posição da janela entre execuções: sem isso ela reabria
# sempre em 1360x900, descartando o ajuste do usuário a cada abertura.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Kept outside the Tauri shell so another product can depend on the same local STT engine.
mangaba-stt = { path = "../../../stt" }
